<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory-APP</title>

    <script type="module" src="/src/main.ts"></script>
</head>

<body>

    <main class="start-page">

        <div class="start-page__title">
            <p>It's play time.</p>
            <h1>Ready to play?</h1>
        </div>


        <button class="start-page__button" id="start-button" type="button">
            <img class="start-page__button__ctl-img" src="/img/btn-controller.png" alt="">
            <span class="start-page__button__text">Play</span>

            <span class="start-page__button__arrow">
                <img class="start-page__button__arrow-img" src="/img/start-arrow.png" alt="">
                <img class="start-page__button__arrow-hover-img" src="/img/start-arrow-hover.png" alt="">
            </span>
        </button>

        <div class="start-page__logo">
            <img src="/img/overlay-controller.png" alt="Memory-APP Logo">
        </div>

    </main>

</body>

</html>
