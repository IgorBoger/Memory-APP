<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory-APP</title>

    <link rel="stylesheet" href="src/styles/style.scss">
    <script type="module" src="/src/main.ts"></script>
</head>

<body>



    <main class="start-page page page--active" id="startPage">

        <div class="start-page__title">
            <p>It's play time.</p>
            <h1>Ready to play?</h1>
        </div>


        <button class="start-page__button" id="playButton" type="button">
            <img class="start-page__button__ctl-img" src="/img/legacy-start-page/btn-controller.png" alt="">
            <span class="start-page__button__text">Play</span>

            <span class="start-page__button__arrow">
                <img class="start-page__button__arrow-img" src="/img/legacy-start-page/start-arrow.png" alt="">
                <img class="start-page__button__arrow-hover-img" src="/img/legacy-start-page/start-arrow-hover.png"
                    alt="">
            </span>
        </button>

        <div class="start-page__logo">
            <img src="/img/legacy-start-page/overlay-controller.png" alt="Memory-APP Logo">
        </div>

    </main>

    <section class="settings-page page" id="settingsPage" hidden>

        <div class="settings-page__title">
            <h1>Settings</h1>
            <img src="/img/settings-page/settings-underline.png" alt="">
        </div>

        <div class="settings-page__content">

            <div class="settings-page__options">
                <div class="settings-page__option-group">
                    <h2>
                        <img src="/img/settings-page/game-themes.png" alt="">
                        Game themes
                    </h2>

                    <div class="settings-page__option-list settings-page__theme-list">
                        <label>
                            <input type="radio" name="game-theme" value="code-vibes" checked>
                            <span>Code vibes theme</span>
                            <img class="settings-page__option-indicator" src="/img/settings-page/option-indicator.png"
                                alt="">
                        </label>

                        <label>
                            <input type="radio" name="game-theme" value="gaming">
                            <span>Gaming theme</span>
                            <img class="settings-page__option-indicator" src="/img/settings-page/option-indicator.png"
                                alt="">
                        </label>

                        <label>
                            <input type="radio" name="game-theme" value="da-projects">
                            DA Projects theme
                        </label>

                        <label>
                            <input type="radio" name="game-theme" value="foods">
                            Foods theme
                        </label>
                    </div>
                </div>

                <div class="settings-page__option-group">
                    <h2>
                        <img src="/img/settings-page/choose-player.png" alt="">
                        Choose player
                    </h2>

                    <div class="settings-page__option-list">
                        <label>
                            <input type="radio" name="player" value="blue" checked>
                            Blue
                        </label>

                        <label>
                            <input type="radio" name="player" value="orange">
                            Orange
                        </label>
                    </div>
                </div>

                <div class="settings-page__option-group">
                    <h2>
                        <img src="/img/settings-page/board-size.png" alt="">
                        Board size
                    </h2>

                    <div class="settings-page__option-list">
                        <label>
                            <input type="radio" name="board-size" value="16" checked>
                            16 cards
                        </label>

                        <label>
                            <input type="radio" name="board-size" value="24">
                            24 cards
                        </label>

                        <label>
                            <input type="radio" name="board-size" value="36">
                            36 cards
                        </label>
                    </div>
                </div>
            </div>

            <div class="settings-page__preview">

                <div class="settings-page__preview-content settings-page__preview-content--code-vibes"
                    id="settingsPreview" data-theme-preview="code-vibes">

                    <div class="settings-page__preview-header">

                        <div class="settings-page__score-list">
                            <span class="settings-page__score settings-page__score--blue">
                                <img id="settingsPreviewBlueLabel"
                                    src="/img/settings-page/gaming-theme/code-vibes/blue-label.png" alt="">
                                <p>Blue</p>
                                <p>0</p>
                            </span>

                            <span class="settings-page__score settings-page__score--orange">
                                <img id="settingsPreviewOrangeLabel"
                                    src="/img/settings-page/gaming-theme/code-vibes/orange-label.png" alt="">
                                <p>Orange</p>
                                <p>0</p>
                            </span>
                        </div>

                        <span class="settings-page__current-player">
                            <p>Current player:</p>
                            <img id="settingsPreviewCurrentPlayerIcon"
                                src="/img/settings-page/gaming-theme/code-vibes/blue-label.png" alt="">
                        </span>

                        <button type="button" class="settings-page__exit-button">
                            <img id="settingsPreviewExitIcon"
                                src="/img/settings-page/gaming-theme/code-vibes/exit-game.png" alt="">
                            <span>Exit game</span>
                        </button>
                    </div>


                    <div class="settings-page__card-preview">
                        <div class="settings-page__preview-card settings-page__preview-card--primary">
                            <img class="settings-page__preview-card-image" id="settingsPreviewPrimaryCard"
                                src="/img/settings-page/gaming-theme/code-vibes/dev-logo.png" alt="Code vibes card">
                        </div>

                        <div class="settings-page__preview-card settings-page__preview-card--secondary">
                            <img class="settings-page__preview-card-image" id="settingsPreviewSecondaryCard"
                                src="/img/settings-page/gaming-theme/code-vibes/git-logo.png" alt="Git card">
                        </div>
                    </div>
                </div>


                <div class="settings-page__summary">

                    <span>Theme </span>
                    <img src="/img/settings-page/summary-divider.png" alt="">
                    <span>Player</span>
                    <img src="/img/settings-page/summary-divider.png" alt="">
                    <span>Board size</span>

                    <button class="settings-page__start-button" id="start-game-button" type="button" disabled>
                        <img src="/img/settings-page/start-game-icon.png" alt="">
                        <span>Start</span>
                    </button>

                </div>

            </div>
        </div>

    </section>


    <section class="playing-field page hidden" id="playingField">
        <div class="playing-field__stage">

            <div class="playing-field__content">

                <div class="game-header game-header--playing-field">

                    <div class="game-header__scoreboard">
                        <span class="game-header__score game-header__score--blue">
                            <img src="/img/game-field/blue-label.png" alt="">
                            <p>Blue</p>
                            <p>0</p>
                        </span>

                        <span class="game-header__score game-header__score--orange">
                            <img src="/img/game-field/orange-label.png" alt="">
                            <p>Orange</p>
                            <p>0</p>
                        </span>
                    </div>

                    <span class="game-header__current-player">
                        <p>Current player:</p>
                        <img src="/img/game-field/blue-label.png" alt="">
                    </span>

                    <button type="button" class="game-header__exit-button">
                        <img src="/img/game-field/exit-game.png" alt="">
                        <span>Exit game</span>
                    </button>
                </div>

                <div class="playing-field__board" id="playingFieldBoard">

                </div>


            </div>

        </div>
    </section>


</body>

</html>
